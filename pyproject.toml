[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-gif"
version = "1.0.0"
description = "Trasforma partite di scacchi in notazione PGN in GIF animate con Manim"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giordi9902" }]
requires-python = ">=3.10"
dependencies = ["manim>=0.18", "chess>=1.10"]
keywords = ["chess", "scacchi", "pgn", "gif", "manim", "animation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pgn-gif = "pgn_gif:main"

[project.urls]
Homepage = "https://github.com/Giordi9902/pgn_gif"

[tool.setuptools]
py-modules = ["pgn_gif", "pgn_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renderizza davvero una GIF con Manim (deselezionabile con -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning:chess.engine"]
